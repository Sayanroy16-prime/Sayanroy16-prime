<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 200" width="100%" height="200">
  <defs>
    <!-- Ultra-Vibrant Animated Gradient -->
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF007F">
        <animate attributeName="stop-color" values="#FF007F;#7928CA;#00F0FF;#00FF66;#FFD700;#FF007F" dur="3s" repeatCount="indefinite" />
      </stop>
      <stop offset="25%" stop-color="#7928CA">
        <animate attributeName="stop-color" values="#7928CA;#00F0FF;#00FF66;#FFD700;#FF007F;#7928CA" dur="3s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#00F0FF">
        <animate attributeName="stop-color" values="#00F0FF;#00FF66;#FFD700;#FF007F;#7928CA;#00F0FF" dur="3s" repeatCount="indefinite" />
      </stop>
      <stop offset="75%" stop-color="#00FF66">
        <animate attributeName="stop-color" values="#00FF66;#FFD700;#FF007F;#7928CA;#00F0FF;#00FF66" dur="3s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#FFD700">
        <animate attributeName="stop-color" values="#FFD700;#FF007F;#7928CA;#00F0FF;#00FF66;#FFD700" dur="3s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="3" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@700;900&amp;family=Orbitron:wght@800;900&amp;family=Outfit:wght@800;900&amp;display=swap');

      .main-name {
        font-family: 'Syncopate', 'Orbitron', 'Outfit', 'Montserrat', 'Segoe UI', system-ui, sans-serif;
        font-weight: 900;
        font-size: 54px;
        fill: url(#titleGradient);
        filter: url(#neonGlowFilter);
        letter-spacing: 12px;
        text-transform: uppercase;
      }

      .sub-header {
        font-family: 'Outfit', 'Segoe UI', system-ui, sans-serif;
        font-size: 17px;
        font-weight: 800;
        fill: #00F0FF;
        letter-spacing: 4px;
        text-transform: uppercase;
      }

      .pill-text {
        font-family: 'Fira Code', Monaco, monospace;
        font-size: 13px;
        font-weight: 700;
        fill: #FFD700;
        letter-spacing: 2px;
      }

      .line-accent {
        stroke: url(#titleGradient);
        stroke-width: 2.5;
        stroke-linecap: round;
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect x="4" y="4" width="912" height="192" rx="16" fill="#0A0C14" stroke="url(#titleGradient)" stroke-width="2.5" />

  <!-- Accent Top Line -->
  <line x1="80" y1="28" x2="840" y2="28" class="line-accent" />

  <!-- Main Name with Futuristic High-End Font & Animation -->
  <text x="50%" y="88" text-anchor="middle" class="main-name">SAYAN ROY</text>

  <!-- Accent Bottom Line -->
  <line x1="80" y1="114" x2="840" y2="114" class="line-accent" />

  <!-- Subtitle Tagline -->
  <text x="50%" y="148" text-anchor="middle" class="sub-header">2nd Year CSE @ SRMIST KTR • Systems &amp; Full-Stack</text>

  <!-- Status Bar -->
  <text x="50%" y="174" text-anchor="middle" class="pill-text">⚡ [ LEVEL UP ] • [ FULL-STACK &amp; IoT ] • [ COFFEE POWERED ] ☕</text>
</svg>
