<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 190" width="100%" height="190">
  <defs>
    <!-- Pixel 8-Bit Blinking Color Palette -->
    <linearGradient id="pixelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF0055">
        <animate attributeName="stop-color" values="#FF0055;#00F0FF;#00FF66;#FFE600;#BF00FF;#FF0055" dur="2s" repeatCount="indefinite" />
      </stop>
      <stop offset="25%" stop-color="#00F0FF">
        <animate attributeName="stop-color" values="#00F0FF;#00FF66;#FFE600;#BF00FF;#FF0055;#00F0FF" dur="2s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#00FF66">
        <animate attributeName="stop-color" values="#00FF66;#FFE600;#BF00FF;#FF0055;#00F0FF;#00FF66" dur="2s" repeatCount="indefinite" />
      </stop>
      <stop offset="75%" stop-color="#FFE600">
        <animate attributeName="stop-color" values="#FFE600;#BF00FF;#FF0055;#00F0FF;#00FF66;#FFE600" dur="2s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#BF00FF">
        <animate attributeName="stop-color" values="#BF00FF;#FF0055;#00F0FF;#00FF66;#FFE600;#BF00FF" dur="2s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Pixel Retro Glow -->
    <filter id="pixelGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .pixel-title {
        font-family: 'Courier New', 'VT323', monospace;
        font-weight: 900;
        font-size: 50px;
        fill: url(#pixelGrad);
        filter: url(#pixelGlow);
        letter-spacing: 6px;
        text-shadow: 4px 4px 0px #000;
      }
      .pixel-sub {
        font-family: 'Courier New', monospace;
        font-size: 17px;
        font-weight: 700;
        fill: #00F0FF;
        letter-spacing: 2px;
      }
      .pixel-tag {
        font-family: 'Courier New', monospace;
        font-size: 14px;
        font-weight: bold;
        fill: #FF0055;
      }
      .pixel-heart {
        animation: heartPulse 0.8s infinite alternate;
      }
      @keyframes heartPulse {
        from { transform: scale(1); }
        to { transform: scale(1.2); }
      }
    </style>
  </defs>

  <!-- Arcade Dark Grid Background -->
  <rect x="6" y="6" width="888" height="178" rx="12" fill="#090A10" stroke="url(#pixelGrad)" stroke-width="3" />

  <!-- Corner Pixel Accent Boxes -->
  <rect x="12" y="12" width="10" height="10" fill="#FF0055"/>
  <rect x="878" y="12" width="10" height="10" fill="#00F0FF"/>
  <rect x="12" y="168" width="10" height="10" fill="#00FF66"/>
  <rect x="878" y="168" width="10" height="10" fill="#FFE600"/>

  <!-- 8-Bit Pixel Title -->
  <text x="50%" y="75" text-anchor="middle" class="pixel-title">👾 SAYAN ROY 👾</text>

  <!-- Subtitle Tagline -->
  <text x="50%" y="122" text-anchor="middle" class="pixel-sub">🕹️ 2nd Year CSE @ SRMIST KTR | Full-Stack &amp; Systems Engineer 🚀</text>

  <!-- Bottom Arcade Bar -->
  <text x="50%" y="155" text-anchor="middle" class="pixel-tag">[ LEVEL 2: 2ND YEAR ] • [ PRESS START TO CONNECT ] • [ COFFEE POWERED ]</text>
</svg>
